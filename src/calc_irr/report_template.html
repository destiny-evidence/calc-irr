<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>IRR Report</title>
<style>
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: #f7f7f8;
    color: #1a1a1a;
    margin: 0;
    padding: 2rem;
}
.report {
    max-width: 900px;
    margin: 0 auto;
    background: #fff;
    padding: 2rem 2.5rem;
    border-radius: 8px;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
}
h1 { font-size: 1.75rem; margin-bottom: 0.25rem; }
.generated-at { color: #666; font-size: 0.9rem; margin-top: 0; margin-bottom: 2rem; }
h2 { font-size: 1.3rem; margin-top: 2.5rem; border-bottom: 2px solid #eee; padding-bottom: 0.4rem; }
h3 { font-size: 1rem; margin-top: 1.5rem; color: #444; }
.alpha-stat { font-size: 1rem; }
table.data-table {
    border-collapse: collapse;
    width: 100%;
    margin: 0.5rem 0 1.5rem 0;
    font-size: 0.9rem;
}
table.data-table th, table.data-table td {
    text-align: left;
    padding: 0.5rem 0.75rem;
    border-bottom: 1px solid #eee;
}
table.data-table th { background: #f3f3f4; font-weight: 600; }
table.data-table tr:nth-child(even) { background: #fafafa; }
</style>
</head>
<body>
<div class="report">
    <h1>Inter-Rater Reliability Report</h1>
    <p class="generated-at">Generated $generated_at</p>
    $key_sections
</div>
</body>
</html>
