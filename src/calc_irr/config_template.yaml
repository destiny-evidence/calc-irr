# ---------------------------------------------------------------------------
# Input and output
# ---------------------------------------------------------------------------

# Path to the CSV with one row per (item, coder) annotation.
input: annotations.csv

# Where to write the HTML report.
output: output/report.html

# Directory to write <key>_coding.csv files for nominal keys.
# Required only if any key below is "nominal".
priority_dir: output

# Directory to write <key>_to_review.csv files (the disagreement subset of
# each coding file) for nominal keys. Optional -- defaults to priority_dir.
# review_dir: output

# ---------------------------------------------------------------------------
# Columns in the input CSV
# ---------------------------------------------------------------------------

coder_id: user_id
item_id: item_id

# Title and abstract text, copied into the coding/review/resolved CSVs and
# used by the text quality checks below. Optional: if the text column isn't
# in the CSV, both are skipped.
item_text_column: abstract
item_title_column: title

# Restrict to these coder ids only (optional; omit to use everyone in the CSV).
# coders:
#   - alice
#   - bob

# ---------------------------------------------------------------------------
# Keys to report on
# ---------------------------------------------------------------------------

# Each key mapped to its type: nominal, ordinal, interval, or ratio.
keys:
  example_key: nominal

# ---------------------------------------------------------------------------
# Extra information in the report and coding/review CSVs (calc-irr run)
# ---------------------------------------------------------------------------

# Automatic text checks, on by default. The report ends with a "Text quality"
# summary, and the coding/review CSVs get True/False columns after the
# abstract text:
#   title_missing, abstract_missing -- blank, a placeholder like "N/A", or
#     (abstracts only) under 20 characters
#   title_non_english, abstract_non_english -- abstracts are checked sentence
#     by sentence, so partly non-English abstracts are caught too
# Language detection uses fastText's model, downloaded (~1MB) on first run to
# ~/.cache/calc-irr/ unless language_model_path points at a saved copy. If it
# can't be loaded, the non_english columns are skipped with a warning.
text_quality: true
# language_model_path: path/to/lid.176.ftz
# Replaces the built-in list of "no abstract" placeholders (case-insensitive):
# missing_placeholders: ["", "n/a", "none", "no abstract available"]

# Yes/no questions coders answered, flagged per item (optional). Each flag
# adds an `any_marked_<name>` column to the coding/review/resolved CSVs: True
# if at least one coder gave `value` as the answer to the `key` question
# (matching the CSV's <key>|0 / <key>|1 columns). A blank answer counts as
# not marked. `value` defaults to 1; `report: true` also adds a line to the
# report saying how many unique items were marked (off by default).
# flags:
#   difficult:            # any_marked_difficult
#     key: is_difficult
#     value: 1
#     report: true
#   ineligible:           # any_marked_ineligible
#     key: is_eligible
#     value: 0

# Merge resolved/gold labels in as an extra coder, per key (optional). Each
# path is a CSV with an item id column and a `resolved` column -- e.g. the
# <key>_resolved.csv from `calc-irr resolve`. Useful for checking a
# newly-added coder against labels that were already adjudicated.
# gold:
#   example_key: path/to/example_key_resolved.csv
# gold_coder_id: gold

# ---------------------------------------------------------------------------
# Resolving disagreements (calc-irr resolve)
# ---------------------------------------------------------------------------

# Directory for the discussion step. Put the completed review file here as
# <key>_to_review_completed.csv (with `resolved` filled in by hand); resolve
# writes <key>_resolved.csv next to it. Required for `calc-irr resolve`.
# resolved_dir: output
