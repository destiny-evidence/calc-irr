# ---------------------------------------------------------------------------
# Input and output
# ---------------------------------------------------------------------------

# Path to the CSV with one row per (item, coder) annotation.
input: annotations.csv

# Where to write the HTML report.
output: output/report.html

# Directory to write <key>_coding.csv files for nominal keys.
# Required only if any key below is "nominal".
priority_dir: output

# Directory to write <key>_to_review.csv files (the disagreement subset of
# each coding file) for nominal keys. Optional -- defaults to priority_dir.
# review_dir: output

# ---------------------------------------------------------------------------
# Columns in the input CSV
# ---------------------------------------------------------------------------

coder_id: user_id
item_id: item_id

# Title and abstract text, copied into the coding/review/resolved CSVs
# (optional).
item_text_column: abstract
item_title_column: title

# Restrict to these coder ids only (optional; omit to use everyone in the CSV).
# coders:
#   - alice
#   - bob

# ---------------------------------------------------------------------------
# Keys to report on
# ---------------------------------------------------------------------------

# Each key mapped to its type: nominal, ordinal, interval, or ratio.
keys:
  example_key: nominal

# ---------------------------------------------------------------------------
# Extra information in the report and coding/review CSVs (calc-irr run)
# ---------------------------------------------------------------------------

# Merge resolved/gold labels in as an extra coder, per key (optional). Each
# path is a CSV with an item id column and a `resolved` column -- e.g. the
# <key>_resolved.csv from `calc-irr resolve`. Useful for checking a
# newly-added coder against labels that were already adjudicated.
# gold:
#   example_key: path/to/example_key_resolved.csv
# gold_coder_id: gold

# ---------------------------------------------------------------------------
# Resolving disagreements (calc-irr resolve)
# ---------------------------------------------------------------------------

# Directory for the discussion step. Put the completed review file here as
# <key>_to_review_completed.csv (with `resolved` filled in by hand); resolve
# writes <key>_resolved.csv next to it. Required for `calc-irr resolve`.
# resolved_dir: output
