[project]
name = "calc-irr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "krippendorff>=0.8.2",
    "pandas>=3.0.3",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
]

[project.scripts]
calc-irr = "calc_irr.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/calc_irr"]

[dependency-groups]
dev = [
    "ipython>=9.15.0",
    "pre-commit>=4.6.0",
]
